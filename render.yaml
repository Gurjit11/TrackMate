services:
  - type: web
    name: trackmate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.rag build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: models/gemini-3.8-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: DELIVERY_MODE
        value: dry_run
